# EXPERIMENT tpd-3p3d — TRADITIONAL dynamo P/D disaggregation, 3 prefill + 3 decode, all TEP=2.
#
# This is the NATIVE dynamo prefill/decode (P/D) disagg path — separate prefill + decode
# dynamo workers + the dynamo KV-router — NOT the kvbm_hub prefill-aside used by the CD
# (cda/cdb/cdg) recipes. KV-AWARE routing routes each request to a PREFILL worker first
# (P-first); the chosen prefill computes/onboards the prefix, then hands the KV to a decode
# worker over NIXL.
#
# KVBM + the in-process CONSOLIDATOR run on the PREFILL workers ONLY (kvbm_consolidator=true
# + a PdConnector connector that wraps [DynamoConnector(+leader, G2=160/rank), NixlConnector]
# so the KV still transfers prefill->decode over NIXL). The consolidator relays each prefill
# worker's G1+G2 KV events to the dynamo KV-router, so P-first routing is prefix-cache-aware.
# DECODE workers are PLAIN vLLM: NOT KV-aware, NO kvbm, NO consolidator (connector: nixl).
#
# Topology (ISO-GPU, 1 TEP=2 worker/node): 3 prefill (1/node = 3 nodes) + 3 decode (1/node
# = 3 nodes) => 6 GB200 nodes, 12 active GPUs (each worker uses 2 of its node's 4 GPUs;
# etcd/nats + dynamo frontend + KV-router co-located on the head prefill node, no 7th node).
# Sibling variants tpd-4p2d / tpd-2p4d differ ONLY in the prefill/decode (and node) counts.
# Image kvbm-prod-260607.sqsh (FP8 + B-GNMT + breaker + CD token-load metrics).

name: "kvbm-tpd-3p3d"

identity:
  model:
    repo: "nvidia/Qwen3-235B-A22B-Instruct-2507-NVFP4"
    revision: "1c4ec35802abf3a20672be7e5c51a098796f71d6"
  container:
    image: "nvcr.io/nvidian/dynamo-dev/ryan:kvbm-vllm-dev-260602"
  frameworks:
    dynamo: "1.2.0"
    vllm: "0.21.0"

slurm:
  account: "core_dlfw_ci"
  partition: "tcpo"
  time_limit: "01:45:00"

setup_script: kvbm-dev-install.sh
dynamo:
  install: false

model:
  path: "hf:nvidia/Qwen3-235B-A22B-Instruct-2507-NVFP4"
  container: "/lustre/fsw/core_dlfw_ci/ryan/enroot_images/kvbm-prod-260607.sqsh"  # FP8 + B-GNMT + breaker + CD token-load metrics
  precision: "fp4"

extra_mount:
  - "/lustre/fsw/core_dlfw_ci/ryan/kvbm-experiments/dynamo:/workspace"
  - "/lustre/fsw/core_dlfw_ci/ryan/kvbm-experiments:/models"
  - "/lustre/fsw/core_dlfw_ci/ryan/hf_cache:/hf_cache"

environment:
  HF_HOME: "/hf_cache"
  HF_HUB_OFFLINE: "1"
  KVBM_SKIP_VLLM_VERSION_CHECK: "1"
  VLLM_ATTENTION_BACKEND: "FLASH_ATTN"
  ENABLE_EXPERT_PARALLEL: "1"           # TEP: 235B-A22B (128 experts) — EP across the 2 TP ranks
  NIXL_PLUGIN_DIR: "/usr/local/lib/python3.12/dist-packages/.nixl_cu13.mesonpy.libs/plugins"
  # No hub => G2 activity reads from vllm:external_prefix_cache_hits on the prefill workers.
  DYN_LOG: "error"
  RUST_LOG: "error"

resources:
  gpu_type: "gb200"
  gpus_per_node: 4
  # Native dynamo P/D disagg: 3 PREFILL + 3 DECODE TEP=2 workers (2 GPU each), 1 worker/node.
  prefill_nodes: 3
  prefill_workers: 3
  gpus_per_prefill: 2
  decode_nodes: 3
  decode_workers: 3
  gpus_per_decode: 2
  spread_workers: true                  # 1 TEP=2 worker/node (full node each) => 6 GB200 nodes

infra:
  etcd_nats_dedicated_node: false       # co-locate etcd/nats + frontend on the head node (no 7th node)

frontend:
  type: dynamo
  enable_multiple_frontends: false
  args:
    router-mode: "kv"                   # KV-AWARE, P-first (routes to a prefill worker first)
    router-kv-events: true              # consume the prefill consolidator's G1+G2 KV events
    router-min-initial-workers: 3       # = prefill_workers (the KV-routable / KV-event-publishing pool)

backend:
  type: vllm

  # KVBM + consolidator on the PREFILL workers (mirror the CD decode wiring): kvbm_consolidator
  # forces prefix-caching ON + emits per-worker KV events the consolidator relays to the
  # KV-router. The prefill connector is a PdConnector wrapping the kvbm v2 DynamoConnector
  # (child[0]: local prefix match/offload/onboard; G2 host cache_size_gb=160 PER-RANK, same as
  # CD/agg) AND a NixlConnector (child[1]: the prefill->decode KV transfer). Decode workers use
  # connector: nixl (plain vLLM) so the consolidator path never fires for them.
  kvbm_consolidator: true

  prefill_environment:
    DYN_HEALTH_CHECK_ENABLED: "false"
    PYTHONUNBUFFERED: "1"

  decode_environment:
    DYN_HEALTH_CHECK_ENABLED: "false"
    PYTHONUNBUFFERED: "1"

  vllm_config:
    prefill:
      served-model-name: "nvidia/Qwen3-235B-A22B-Instruct-2507-NVFP4"
      tensor-parallel-size: 2           # TEP=2
      enable-expert-parallel: true
      gpu-memory-utilization: 0.85
      block-size: 64
      max-model-len: 262144
      # PdConnector: KVBM (G2=160/rank, consolidator) composed with NIXL (P->D transfer).
      connector: '{"kv_connector": "PdConnector", "kv_role": "kv_both", "kv_connector_module_path": "kvbm.v2.vllm.connector", "kv_connector_extra_config": {"connectors": [{"kv_connector": "DynamoConnector", "kv_role": "kv_both", "kv_connector_module_path": "kvbm.v2.vllm.connector", "kv_connector_extra_config": {"default": {"block_layout": "operational"}, "leader": {"cache": {"host": {"cache_size_gb": 160.0}}, "max_seq_len": 262144}, "worker": {"nixl": {"backends": {"UCX": {}, "POSIX": {}}}}}}, {"kv_connector": "NixlConnector", "kv_role": "kv_both"}]}}'

    decode:
      served-model-name: "nvidia/Qwen3-235B-A22B-Instruct-2507-NVFP4"
      tensor-parallel-size: 2           # TEP=2
      enable-expert-parallel: true
      gpu-memory-utilization: 0.85
      block-size: 64
      max-model-len: 262144
      connector: "nixl"                 # PLAIN vLLM decode: NIXL only, no kvbm/consolidator

benchmark:
  type: "trace-replay-sa"
  public_dataset: "semianalysis_cc_traces_weka_with_subagents_256k"
  num_dataset_entries: 470           # full with-subagents 256k corpus (470 traces)
  concurrencies: "48"
  ttft_threshold_ms: 5000
  itl_threshold_ms: 10
  aiperf_package: "git+https://github.com/cquil11/aiperf.git@062a5de92c8ac8a0a6dd5d2a7fb9a539a147f3d9"
  aiperf_args:
    benchmark-duration: 1200
    benchmark-grace-period: 30
    request-timeout-seconds: 1200
    workers-max: 200
    record-processors: 8
    profile-export-level: raw
    concurrency-ramp-duration: 120
    export-http-trace: true
