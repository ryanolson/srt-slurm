# EXPERIMENT cd#2 — Conditional Disaggregation, 4 decode + 2 prefill (all TEP=4).
#
# Identical to cd#1 (cd1-5d1p-trace-replay-sa.yaml) EXCEPT the decode/prefill split:
# 4 AGGREGATED decode workers (TEP=4) + 2 hub-owned PREFILL ASIDE nodes (TEP=4).
# Same OPERATIONAL hub (symmetric TP), same Conditional Threshold = 1024 tokens,
# same model / image / benchmark. Tests shifting GPU budget from decode to prefill.
#
# Topology: 4 decode + 2 prefill = 6 GB200 serving nodes + 1 dedicated infra node
# (etcd/nats + kvbm_hub) = 7 nodes.
#
# Part of the agg-vs-CD comparison set (see docs/runs/cd_comparison_experiments.md).

name: "kvbm-cd2-4d2p-trace-replay-sa"

identity:
  model:
    repo: "nvidia/Qwen3-235B-A22B-Instruct-2507-NVFP4"
    revision: "1c4ec35802abf3a20672be7e5c51a098796f71d6"
  container:
    image: "nvcr.io/nvidian/dynamo-dev/ryan:kvbm-vllm-dev-260602"
  frameworks:
    dynamo: "1.2.0"
    vllm: "0.21.0"

slurm:
  account: "core_dlfw_ci"
  partition: "tcpo"
  time_limit: "01:45:00"

setup_script: kvbm-dev-install.sh
dynamo:
  install: false

model:
  path: "hf:nvidia/Qwen3-235B-A22B-Instruct-2507-NVFP4"
  container: "/lustre/fsw/core_dlfw_ci/ryan/enroot_images/kvbm-prod-260603b.sqsh"
  precision: "fp4"

extra_mount:
  - "/lustre/fsw/core_dlfw_ci/ryan/kvbm-experiments/dynamo:/workspace"
  - "/lustre/fsw/core_dlfw_ci/ryan/kvbm-experiments:/models"
  - "/lustre/fsw/core_dlfw_ci/ryan/hf_cache:/hf_cache"

environment:
  HF_HOME: "/hf_cache"
  HF_HUB_OFFLINE: "1"
  KVBM_SKIP_VLLM_VERSION_CHECK: "1"
  VLLM_ATTENTION_BACKEND: "FLASH_ATTN"
  ENABLE_EXPERT_PARALLEL: "1"
  NIXL_PLUGIN_DIR: "/usr/local/lib/python3.12/dist-packages/.nixl_cu13.mesonpy.libs/plugins"
  KVBM_CONTROL_METRICS: "true"
  DYN_LOG: "error"
  RUST_LOG: "error"

resources:
  gpu_type: "gb200"
  gpus_per_node: 4
  # Decode plane: 4 AGGREGATED TEP=4 workers, one GB200 node each.
  agg_nodes: 4
  agg_workers: 4
  gpus_per_agg: 4
  # Hub-owned PREFILL ASIDE: 2 GB200 nodes, TEP=4 (one worker per node).
  kvbm_prefill_nodes: 2
  kvbm_prefill_tp: 4

infra:
  # Co-locate etcd/nats + kvbm_hub on a serving node => exactly 6 GB200 nodes
  # (= 4 decode + 2 prefill), per spec.
  etcd_nats_dedicated_node: false

frontend:
  type: dynamo
  enable_multiple_frontends: false
  args:
    router-mode: "kv"
    router-kv-events: true
    router-min-initial-workers: 4   # = agg_workers (decode only; prefill is invisible)

backend:
  type: vllm

  kvbm_hub:
    hub_binary: "/opt/kvbm/bin/kvbm_hub"
    block_layout: operational          # symmetric TP (decode TEP4 == prefill TEP4)
    min_remote_prefill_tokens: 1024    # Conditional Threshold = 1024 tokens
    host_cache_gb: 160.0               # PER-RANK => 640 GiB total/node on TP4 (cgroup cap ~890; ~100 GiB margin; 200/rank OOMs — see cd1 note)

  aggregated_environment:
    DYN_HEALTH_CHECK_ENABLED: "false"
    PYTHONUNBUFFERED: "1"

  vllm_config:
    aggregated:
      served-model-name: "nvidia/Qwen3-235B-A22B-Instruct-2507-NVFP4"
      tensor-parallel-size: 4
      enable-expert-parallel: true
      gpu-memory-utilization: 0.85
      block-size: 64
      max-model-len: 262144

benchmark:
  type: "trace-replay-sa"
  public_dataset: "semianalysis_cc_traces_weka_with_subagents_256k"
  num_dataset_entries: 470           # full with-subagents 256k corpus (470 traces)
  concurrencies: "24"
  ttft_threshold_ms: 5000
  itl_threshold_ms: 10
  aiperf_package: "git+https://github.com/cquil11/aiperf.git@062a5de92c8ac8a0a6dd5d2a7fb9a539a147f3d9"
  aiperf_args:
    benchmark-duration: 1200
    benchmark-grace-period: 30
    request-timeout-seconds: 1200
    workers-max: 200
    record-processors: 8
    profile-export-level: raw
    concurrency-ramp-duration: 120
    export-http-trace: true
