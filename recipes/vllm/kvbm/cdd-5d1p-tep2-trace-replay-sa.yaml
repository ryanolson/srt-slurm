# EXPERIMENT cd-D — Conditional Disaggregation, 5 decode + 1 prefill, all TEP=2.
#
# Decode-heavy CD split: 5 AGGREGATED decode workers (TEP=2) + 1 hub-owned PREFILL
# ASIDE (TEP=2). Motivation: the prefill aside was lightly loaded in cd-A (4d2p) /
# cd-B (3d3p) — most requests prefill locally (threshold 1024 + high prefix-cache
# coverage), so the disagg prefill volume is modest. cd-D shifts GPU budget toward
# decode (5 vs 4/3) with a single prefill worker, to test whether 1 prefill suffices
# and the extra decode lifts throughput. Hub OPERATIONAL (symmetric TP2==TP2),
# Conditional Threshold = 8192 tokens (raised from 1024 — at 1024 the single prefill
# was overwhelmed by 5 decodes' disagg load; see job 2185760).
#
# Topology (ISO-GPU, 1 worker/node): decode 5xTEP2 SPREAD 1/node = 5 nodes; prefill
# 1xTEP2 = 1 node => 6 GB200 nodes total, 12 GPUs used (each worker 2 of 4 GPUs;
# etcd/nats + hub co-located on the head decode node). Iso with cd-A/cd-B (both 6
# nodes / 12 GPUs). See docs/runs/cd_comparison_experiments.md.

name: "kvbm-cdd-5d1p-tep2-trace-replay-sa"

identity:
  model:
    repo: "nvidia/Qwen3-235B-A22B-Instruct-2507-NVFP4"
    revision: "1c4ec35802abf3a20672be7e5c51a098796f71d6"
  container:
    image: "nvcr.io/nvidian/dynamo-dev/ryan:kvbm-vllm-dev-260602"
  frameworks:
    dynamo: "1.2.0"
    vllm: "0.21.0"

slurm:
  account: "core_dlfw_ci"
  partition: "tcpo"
  time_limit: "01:45:00"

setup_script: kvbm-dev-install.sh
dynamo:
  install: false

model:
  path: "hf:nvidia/Qwen3-235B-A22B-Instruct-2507-NVFP4"
  container: "/lustre/fsw/core_dlfw_ci/ryan/enroot_images/kvbm-prod-260603b.sqsh"
  precision: "fp4"

extra_mount:
  - "/lustre/fsw/core_dlfw_ci/ryan/kvbm-experiments/dynamo:/workspace"
  - "/lustre/fsw/core_dlfw_ci/ryan/kvbm-experiments:/models"
  - "/lustre/fsw/core_dlfw_ci/ryan/hf_cache:/hf_cache"

environment:
  HF_HOME: "/hf_cache"
  HF_HUB_OFFLINE: "1"
  KVBM_SKIP_VLLM_VERSION_CHECK: "1"
  VLLM_ATTENTION_BACKEND: "FLASH_ATTN"
  ENABLE_EXPERT_PARALLEL: "1"
  NIXL_PLUGIN_DIR: "/usr/local/lib/python3.12/dist-packages/.nixl_cu13.mesonpy.libs/plugins"
  KVBM_CONTROL_METRICS: "true"
  DYN_LOG: "error"
  RUST_LOG: "error"

resources:
  gpu_type: "gb200"
  gpus_per_node: 4
  # Decode plane: 5 AGGREGATED TEP=2 workers (2 GPU each), SPREAD 1 worker/node => 5 nodes.
  agg_nodes: 5
  agg_workers: 5
  gpus_per_agg: 2
  spread_workers: true
  # Hub-owned PREFILL ASIDE: 1 TEP=2 worker => 1 node.
  kvbm_prefill_nodes: 1
  kvbm_prefill_tp: 2

infra:
  etcd_nats_dedicated_node: false       # co-locate etcd/nats + hub => 6 nodes total

frontend:
  type: dynamo
  enable_multiple_frontends: false
  args:
    router-mode: "kv"
    router-kv-events: true
    router-min-initial-workers: 5       # = agg_workers

backend:
  type: vllm

  kvbm_hub:
    hub_binary: "/opt/kvbm/bin/kvbm_hub"
    block_layout: operational           # symmetric TP (decode TEP2 == prefill TEP2)
    # Threshold 8192 (raised from 1024): with 1 prefill serving 5 decodes, threshold
    # 1024 disaggregated ~every request (94k ISL) and overwhelmed the single prefill
    # (job 2185760). At 8192 only the longest uncached remainders disaggregate; shorter
    # ones prefill locally on the 5 decodes => rebalances load off the single prefill.
    min_remote_prefill_tokens: 8192     # Conditional Threshold = 8192 tokens
    host_cache_gb: 160.0                # PER-RANK
    prefill_max_num_seqs: 8             # cap the single prefill aside's in-flight requests

  aggregated_environment:
    DYN_HEALTH_CHECK_ENABLED: "false"
    PYTHONUNBUFFERED: "1"

  vllm_config:
    aggregated:
      served-model-name: "nvidia/Qwen3-235B-A22B-Instruct-2507-NVFP4"
      tensor-parallel-size: 2           # TEP=2
      enable-expert-parallel: true
      gpu-memory-utilization: 0.85
      block-size: 64
      max-model-len: 262144

benchmark:
  type: "trace-replay-sa"
  public_dataset: "semianalysis_cc_traces_weka_with_subagents_256k"
  num_dataset_entries: 470           # full with-subagents 256k corpus (470 traces)
  concurrencies: "48"
  ttft_threshold_ms: 5000
  itl_threshold_ms: 10
  aiperf_package: "git+https://github.com/cquil11/aiperf.git@062a5de92c8ac8a0a6dd5d2a7fb9a539a147f3d9"
  aiperf_args:
    benchmark-duration: 1200
    benchmark-grace-period: 30
    request-timeout-seconds: 1200
    workers-max: 200
    record-processors: 8
    profile-export-level: raw
    concurrency-ramp-duration: 120
    export-http-trace: true
