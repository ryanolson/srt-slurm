# EXPERIMENT cd-E — 5 decode + 1 prefill, all TEP=2, threshold 1024 + B-GNMT OVERFLOW.
#
# RESULT NOTE (job 2186635): the pre-run sizing below ("trips after ~2-3 cold requests")
# did NOT hold — B-GNMT fired only 8x because under the GENTLE 120s ramp the single aside
# was never saturated (Running:1, Waiting<=3, KV<=32%) at ~96% prefix-hit. The hard-wave
# A/B (cdf-...-{on,off}, ramp=5) is the follow-up that actually saturates it. See the
# corrected analysis in docs/runs/cd_comparison_experiments.md.
#
# THE HEAVY-WAVE GATE for the decode-side prefill-overflow adaptation. This is the EXACT
# config that crashed/overwhelmed the single prefill at threshold 1024 (job 2185760) — 5
# decodes disaggregating ~every 94k-ISL request onto ONE prefill worker. cd-D "fixed" it
# by raising the threshold to 8192 (fewer disaggs); cd-E instead KEEPS threshold 1024 and
# arms B-GNMT: a finite max_inflight_remote_prefill_tokens budget. When the in-flight
# remote-prefill token total is exhausted (a heavy wave), a request that would disaggregate
# is DOWNGRADED to LOCAL prefill on its decode worker — "use the decode workers to help
# prefill in a heavy wave" (commit 7de42c89d8; cd_local_fallback_on_overload default true).
#
# Budget = 262144 (256k) tokens. Reserve unit = full_block_external_tokens (the uncached
# remainder being remote-prefilled). During the COLD ramp the prefix cache is empty so each
# request's remainder ~= full ISL (~92k median) => the budget trips after ~2-3 concurrent
# cold prefills and the rest spill to the 5 decode workers. Once WARM (~96% prefix hit) the
# remainder is ~a few k => the budget rarely trips and disagg proceeds normally. Adaptive:
# active during the wave, inert otherwise.
#
# Topology identical to cd-D: 5xTEP2 decode SPREAD 1/node + 1xTEP2 prefill => 6 GB200 nodes,
# 12 GPUs. See docs/runs/cd_comparison_experiments.md. Image = kvbm-prod-260605.sqsh
# (FP8 + B-GNMT; the 260604 image has FP8 only).

name: "kvbm-cde-5d1p-overflow-trace-replay-sa"

identity:
  model:
    repo: "nvidia/Qwen3-235B-A22B-Instruct-2507-NVFP4"
    revision: "1c4ec35802abf3a20672be7e5c51a098796f71d6"
  container:
    image: "nvcr.io/nvidian/dynamo-dev/ryan:kvbm-vllm-dev-260602"
  frameworks:
    dynamo: "1.2.0"
    vllm: "0.21.0"

slurm:
  account: "core_dlfw_ci"
  partition: "tcpo"
  time_limit: "01:45:00"

setup_script: kvbm-dev-install.sh
dynamo:
  install: false

model:
  path: "hf:nvidia/Qwen3-235B-A22B-Instruct-2507-NVFP4"
  container: "/lustre/fsw/core_dlfw_ci/ryan/enroot_images/kvbm-prod-260605.sqsh"  # FP8 + B-GNMT overflow
  precision: "fp4"

extra_mount:
  - "/lustre/fsw/core_dlfw_ci/ryan/kvbm-experiments/dynamo:/workspace"
  - "/lustre/fsw/core_dlfw_ci/ryan/kvbm-experiments:/models"
  - "/lustre/fsw/core_dlfw_ci/ryan/hf_cache:/hf_cache"

environment:
  HF_HOME: "/hf_cache"
  HF_HUB_OFFLINE: "1"
  KVBM_SKIP_VLLM_VERSION_CHECK: "1"
  VLLM_ATTENTION_BACKEND: "FLASH_ATTN"
  ENABLE_EXPERT_PARALLEL: "1"
  NIXL_PLUGIN_DIR: "/usr/local/lib/python3.12/dist-packages/.nixl_cu13.mesonpy.libs/plugins"
  KVBM_CONTROL_METRICS: "true"
  # error baseline (suppresses the per-request info! hot-path flood, ~280MB/h) but raise
  # the kvbm_connector crate to warn so the B-GNMT downgrade line surfaces — it is a
  # tracing::warn! (decode_leader.rs:781 "downgrading remote prefill to LOCAL (overload
  # fallback)"), one per downgraded request => grep+count = DIRECT proof B-GNMT fired
  # (independent of the hub binary / CdSnapshot, which this bake did NOT rebuild). Warns
  # are bounded by request count, not per-token, so no flood.
  DYN_LOG: "error,kvbm_connector=warn"
  RUST_LOG: "error,kvbm_connector=warn"

resources:
  gpu_type: "gb200"
  gpus_per_node: 4
  # Decode plane: 5 AGGREGATED TEP=2 workers (2 GPU each), SPREAD 1 worker/node => 5 nodes.
  agg_nodes: 5
  agg_workers: 5
  gpus_per_agg: 2
  spread_workers: true
  # Hub-owned PREFILL ASIDE: 1 TEP=2 worker => 1 node.
  kvbm_prefill_nodes: 1
  kvbm_prefill_tp: 2

infra:
  etcd_nats_dedicated_node: false       # co-locate etcd/nats + hub => 6 nodes total

frontend:
  type: dynamo
  enable_multiple_frontends: false
  args:
    router-mode: "kv"
    router-kv-events: true
    router-min-initial-workers: 5       # = agg_workers

backend:
  type: vllm

  kvbm_hub:
    hub_binary: "/opt/kvbm/bin/kvbm_hub"
    block_layout: operational           # symmetric TP (decode TEP2 == prefill TEP2)
    min_remote_prefill_tokens: 1024     # Conditional Threshold = 1024 (the HEAVY config)
    # B-GNMT overflow budget: finite => arms the decode-side Remote->Local downgrade.
    # 256k tokens; see header. None/omitted would default usize::MAX => feature inert.
    max_inflight_remote_prefill_tokens: 262144
    host_cache_gb: 160.0                # PER-RANK
    prefill_max_num_seqs: 8             # cap the single prefill aside's in-flight requests

  aggregated_environment:
    DYN_HEALTH_CHECK_ENABLED: "false"
    PYTHONUNBUFFERED: "1"

  vllm_config:
    aggregated:
      served-model-name: "nvidia/Qwen3-235B-A22B-Instruct-2507-NVFP4"
      tensor-parallel-size: 2           # TEP=2
      enable-expert-parallel: true
      gpu-memory-utilization: 0.85
      block-size: 64
      max-model-len: 262144

benchmark:
  type: "trace-replay-sa"
  public_dataset: "semianalysis_cc_traces_weka_with_subagents_256k"
  num_dataset_entries: 470           # full with-subagents 256k corpus (470 traces)
  concurrencies: "48"
  ttft_threshold_ms: 5000
  itl_threshold_ms: 10
  aiperf_package: "git+https://github.com/cquil11/aiperf.git@062a5de92c8ac8a0a6dd5d2a7fb9a539a147f3d9"
  aiperf_args:
    benchmark-duration: 1200
    benchmark-grace-period: 30
    request-timeout-seconds: 1200
    workers-max: 200
    record-processors: 8
    profile-export-level: raw
    concurrency-ramp-duration: 120
    export-http-trace: true
