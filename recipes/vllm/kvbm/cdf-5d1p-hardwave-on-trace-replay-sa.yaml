# EXPERIMENT cd-F-ON — 5d+1p TEP2, threshold 1024, B-GNMT ON, HARD COLD WAVE (ramp=0).
#
# The "B" half of the cd-F A/B that asks: does B-GNMT actually HELP 5d+1p under a heavy
# wave (not just fire)? cd-E showed the valve fires (8x) but the aside was never saturated
# under the gentle 120s ramp (Running:1, Waiting<=3) at ~96% prefix-hit, so impact was
# small. cd-F removes the ramp (concurrency-ramp-duration: 0) so all 48 cold requests hit
# AT ONCE against a cold prefix cache => ~48 simultaneous disagg attempts overwhelm the
# single aside (max_num_seqs=8) and the token budget fills immediately. THIS run = budget
# ON (262144); the OFF twin (cdf-...-off, infinite budget, valve inert) is identical except
# B-GNMT is disabled. Everything else held constant (same image, topology, threshold,
# max_num_seqs=8 so NEITHER OOMs) => the spill-to-decode is the ONLY difference. Judge on
# MID-percentile TTFT (p50-p90): B-GNMT relieves QUEUED requests, which live in the mid
# percentiles; the p99 is compute-bound on monster prompts (ISL p99 186k) and won't move.
#
# Topology: 5xTEP2 decode SPREAD 1/node + 1xTEP2 prefill => 6 GB200 nodes, 12 GPUs. The two
# A/B jobs run CONCURRENTLY (6+6 nodes on idle tcpo). See docs/runs/cd_comparison_experiments.md.
# Image = kvbm-prod-260605.sqsh (FP8 + B-GNMT).

name: "kvbm-cdf-5d1p-hardwave-on-trace-replay-sa"

identity:
  model:
    repo: "nvidia/Qwen3-235B-A22B-Instruct-2507-NVFP4"
    revision: "1c4ec35802abf3a20672be7e5c51a098796f71d6"
  container:
    image: "nvcr.io/nvidian/dynamo-dev/ryan:kvbm-vllm-dev-260602"
  frameworks:
    dynamo: "1.2.0"
    vllm: "0.21.0"

slurm:
  account: "core_dlfw_ci"
  partition: "tcpo"
  time_limit: "01:45:00"

setup_script: kvbm-dev-install.sh
dynamo:
  install: false

model:
  path: "hf:nvidia/Qwen3-235B-A22B-Instruct-2507-NVFP4"
  container: "/lustre/fsw/core_dlfw_ci/ryan/enroot_images/kvbm-prod-260605.sqsh"  # FP8 + B-GNMT overflow
  precision: "fp4"

extra_mount:
  - "/lustre/fsw/core_dlfw_ci/ryan/kvbm-experiments/dynamo:/workspace"
  - "/lustre/fsw/core_dlfw_ci/ryan/kvbm-experiments:/models"
  - "/lustre/fsw/core_dlfw_ci/ryan/hf_cache:/hf_cache"

environment:
  HF_HOME: "/hf_cache"
  HF_HUB_OFFLINE: "1"
  KVBM_SKIP_VLLM_VERSION_CHECK: "1"
  VLLM_ATTENTION_BACKEND: "FLASH_ATTN"
  ENABLE_EXPERT_PARALLEL: "1"
  NIXL_PLUGIN_DIR: "/usr/local/lib/python3.12/dist-packages/.nixl_cu13.mesonpy.libs/plugins"
  KVBM_CONTROL_METRICS: "true"
  # kvbm_connector=warn surfaces the B-GNMT downgrade warn (decode_leader.rs:781), one per
  # downgraded request => grep+count = direct firing proof. error baseline kills the info flood.
  DYN_LOG: "error,kvbm_connector=warn"
  RUST_LOG: "error,kvbm_connector=warn"

resources:
  gpu_type: "gb200"
  gpus_per_node: 4
  agg_nodes: 5
  agg_workers: 5
  gpus_per_agg: 2
  spread_workers: true
  kvbm_prefill_nodes: 1
  kvbm_prefill_tp: 2

infra:
  etcd_nats_dedicated_node: false       # co-locate etcd/nats + hub => 6 nodes total

frontend:
  type: dynamo
  enable_multiple_frontends: false
  args:
    router-mode: "kv"
    router-kv-events: true
    router-min-initial-workers: 5

backend:
  type: vllm

  kvbm_hub:
    hub_binary: "/opt/kvbm/bin/kvbm_hub"
    block_layout: operational
    min_remote_prefill_tokens: 1024     # Conditional Threshold = 1024 (the HEAVY config)
    max_inflight_remote_prefill_tokens: 262144   # B-GNMT ON (this is the "ON" arm of the A/B)
    host_cache_gb: 160.0
    prefill_max_num_seqs: 8

  aggregated_environment:
    DYN_HEALTH_CHECK_ENABLED: "false"
    PYTHONUNBUFFERED: "1"

  vllm_config:
    aggregated:
      served-model-name: "nvidia/Qwen3-235B-A22B-Instruct-2507-NVFP4"
      tensor-parallel-size: 2
      enable-expert-parallel: true
      gpu-memory-utilization: 0.85
      block-size: 64
      max-model-len: 262144

benchmark:
  type: "trace-replay-sa"
  public_dataset: "semianalysis_cc_traces_weka_with_subagents_256k"
  num_dataset_entries: 470           # full with-subagents 256k corpus (470 traces)
  concurrencies: "48"
  ttft_threshold_ms: 5000
  itl_threshold_ms: 10
  aiperf_package: "git+https://github.com/cquil11/aiperf.git@062a5de92c8ac8a0a6dd5d2a7fb9a539a147f3d9"
  aiperf_args:
    benchmark-duration: 1200
    benchmark-grace-period: 30
    request-timeout-seconds: 1200
    workers-max: 200
    record-processors: 8
    profile-export-level: raw
    concurrency-ramp-duration: 5        # HARD WAVE: 48 cold requests in 5s (~instant vs the 120s baseline)
    export-http-trace: true
