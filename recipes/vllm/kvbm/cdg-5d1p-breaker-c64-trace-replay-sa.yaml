# === CONCURRENCY 64 variant (see the c48 recipe for the full rationale) ===
# EXPERIMENT cd-G — 5d+1p TEP2, threshold 1024, CIRCUIT BREAKER ENABLED, BIN-PACKED.
#
# THE CAPSTONE for the prefill-overload circuit breaker (commit 831c540724, P1+P2 coarse
# CALM/HOT). The same heavy 5d+1p config (threshold 1024 — every ~94k-ISL request would
# disaggregate onto ONE prefill) that overwhelmed the single prefill (job 2185760), now with
# the ROUTER-SOURCED circuit breaker armed: when the prefill router's free-capacity drops
# (HOT), the hub pushes the tier to the decode workers and they coarsely downgrade
# would-be-remote prefills to LOCAL — relieving the single prefill. Hysteretic (trip
# immediate / clear debounced) so it does not flap. This REPLACES the static per-worker
# B-GNMT budget (max_inflight) as the overload control — so max_inflight is OMITTED here;
# the breaker is the sole overload mechanism under test.
#
# BIN-PACKED (per user 2026-06-04): 5 decode + 1 prefill = 6 TEP2 workers packed 2/node via
# SPREAD 1 TEP=2 worker/node => 6 GB200 nodes (5 decode + 1 prefill), like cda/cdb.
# (BIN-PACKING WAS TRIED + OOM'd, job 2187916: 2 decode/node at host_cache_gb=160/rank =
# 640 GB G2 pinned/node, and the head node ALSO carries the hub+etcd/nats — agg-6xTEP2
# bin-packs fine only because agg has NO hub on the head node. Per user: relax to 1/node.)
# Correct dataset (with_subagents_256k/470). Image kvbm-prod-260606.sqsh (FP8 + B-GNMT +
# circuit breaker). CD-leverage + breaker tier transitions captured by the post-benchmark
# hub-metrics snapshot hook (Prometheus, so KVBM_CONTROL_METRICS=true suffices, RUST_LOG=error).

name: "kvbm-cdg-5d1p-breaker-c64"

identity:
  model:
    repo: "nvidia/Qwen3-235B-A22B-Instruct-2507-NVFP4"
    revision: "1c4ec35802abf3a20672be7e5c51a098796f71d6"
  container:
    image: "nvcr.io/nvidian/dynamo-dev/ryan:kvbm-vllm-dev-260602"
  frameworks:
    dynamo: "1.2.0"
    vllm: "0.21.0"

slurm:
  account: "core_dlfw_ci"
  partition: "tcpo"
  time_limit: "01:45:00"

setup_script: kvbm-dev-install.sh
dynamo:
  install: false

model:
  path: "hf:nvidia/Qwen3-235B-A22B-Instruct-2507-NVFP4"
  container: "/lustre/fsw/core_dlfw_ci/ryan/enroot_images/kvbm-prod-260606.sqsh"  # FP8 + B-GNMT + circuit breaker
  precision: "fp4"

extra_mount:
  - "/lustre/fsw/core_dlfw_ci/ryan/kvbm-experiments/dynamo:/workspace"
  - "/lustre/fsw/core_dlfw_ci/ryan/kvbm-experiments:/models"
  - "/lustre/fsw/core_dlfw_ci/ryan/hf_cache:/hf_cache"

environment:
  HF_HOME: "/hf_cache"
  HF_HUB_OFFLINE: "1"
  KVBM_SKIP_VLLM_VERSION_CHECK: "1"
  VLLM_ATTENTION_BACKEND: "FLASH_ATTN"
  ENABLE_EXPERT_PARALLEL: "1"
  NIXL_PLUGIN_DIR: "/usr/local/lib/python3.12/dist-packages/.nixl_cu13.mesonpy.libs/plugins"
  KVBM_CONTROL_METRICS: "true"        # hub control /v1/metrics fanout — the snapshot hook scrapes this
  DYN_LOG: "error"                    # breaker metrics are Prometheus (log-independent); no need to raise
  RUST_LOG: "error"

resources:
  gpu_type: "gb200"
  gpus_per_node: 4
  # Decode plane: 5 AGGREGATED TEP=2 workers (2 GPU each), SPREAD 1 worker/node => 5 nodes
  # (bin-packing 2/node OOM'd — 640 GB G2/node + hub on the head; see header).
  agg_nodes: 5
  agg_workers: 5
  gpus_per_agg: 2
  spread_workers: true
  # Hub-owned PREFILL ASIDE: 1 TEP=2 worker => 1 node. Total 6 nodes (12 active GPUs).
  kvbm_prefill_nodes: 1
  kvbm_prefill_tp: 2

infra:
  etcd_nats_dedicated_node: false       # co-locate etcd/nats + hub

frontend:
  type: dynamo
  enable_multiple_frontends: false
  args:
    router-mode: "kv"
    router-kv-events: true
    router-min-initial-workers: 5       # = agg_workers (decode only)

backend:
  type: vllm

  kvbm_hub:
    hub_binary: "/opt/kvbm/bin/kvbm_hub"
    block_layout: operational           # symmetric TP (decode TEP2 == prefill TEP2)
    min_remote_prefill_tokens: 1024     # Conditional Threshold = 1024 (the HEAVY config)
    # CIRCUIT BREAKER (router-sourced 3-tier; replaces the static B-GNMT max_inflight budget):
    cd_breaker_enabled: true
    cd_breaker_warm_high: 0.5           # trip CALM->WARM when prefill free-capacity-fraction < 0.5
    cd_breaker_hot_high: 0.15           # trip WARM->HOT (coarse downgrade-all) when free-frac < 0.15
    cd_breaker_clear_low: 0.7           # clear (step down) only when free-frac recovers > 0.7 (gap => no flap)
    cd_breaker_clear_debounce_ticks: 3  # N consecutive recovered ticks before stepping down
    host_cache_gb: 160.0                # PER-RANK
    prefill_max_num_seqs: 8             # cap the single prefill aside's in-flight requests

  aggregated_environment:
    DYN_HEALTH_CHECK_ENABLED: "false"
    PYTHONUNBUFFERED: "1"

  vllm_config:
    aggregated:
      served-model-name: "nvidia/Qwen3-235B-A22B-Instruct-2507-NVFP4"
      tensor-parallel-size: 2           # TEP=2
      enable-expert-parallel: true
      gpu-memory-utilization: 0.85
      block-size: 64
      max-model-len: 262144

benchmark:
  type: "trace-replay-sa"
  public_dataset: "semianalysis_cc_traces_weka_with_subagents_256k"
  num_dataset_entries: 470           # full with-subagents 256k corpus (470 traces)
  concurrencies: "64"
  ttft_threshold_ms: 5000
  itl_threshold_ms: 10
  aiperf_package: "git+https://github.com/cquil11/aiperf.git@062a5de92c8ac8a0a6dd5d2a7fb9a539a147f3d9"
  aiperf_args:
    benchmark-duration: 1200
    benchmark-grace-period: 30
    request-timeout-seconds: 1200
    workers-max: 200
    record-processors: 8
    profile-export-level: raw
    concurrency-ramp-duration: 120
    export-http-trace: true
