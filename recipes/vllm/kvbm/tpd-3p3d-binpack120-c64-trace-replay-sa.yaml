# EXPERIMENT tpd-3p3d-binpack120-c80 — TRADITIONAL dynamo P/D disagg, 3 prefill + 3 decode,
# all TEP=2 — BIN-PACKED 2 workers/node with the KVBM G2 host cache dropped 160 -> 120 GB/rank.
#
# Strategy A (stability via smaller G2): the FAILING 160 GB/rank bin-pack OOM-killed at the
# cold-cache ramp wave because 2 prefill workers (4 ranks) on one node pinned 4 x (160 x 0.931
# = 149 GiB) = 596 GiB, leaving only ~294 GiB headroom under the 890.4 GiB cgroup host-mem cap.
# Dropping to 120 GB/rank => 4 x (120 x 0.931 = 112 GiB) = 447 GiB pinned/node, ~443 GiB headroom
# (>300 target). gpu-memory-utilization stays 0.85 (GPU is NOT the constraint).
#
# This is the NATIVE dynamo prefill/decode (P/D) disagg path — separate prefill + decode
# dynamo workers + the dynamo KV-router — NOT the kvbm_hub prefill-aside used by the CD
# (cda/cdb/cdg) recipes. KV-AWARE routing routes each request to a PREFILL worker first
# (P-first); the chosen prefill computes/onboards the prefix, then hands the KV to a decode
# worker over NIXL.
#
# KVBM + the in-process CONSOLIDATOR run on the PREFILL workers ONLY (kvbm_consolidator=true
# + a PdConnector connector that wraps [DynamoConnector(+leader, G2=120/rank), NixlConnector]
# so the KV still transfers prefill->decode over NIXL). The consolidator relays each prefill
# worker's G1+G2 KV events to the dynamo KV-router, so P-first routing is prefix-cache-aware.
# DECODE workers are PLAIN vLLM: NOT KV-aware, NO kvbm, NO consolidator (connector: nixl) =>
# decode pins ~0 host cache; the worst-case node is a 2-PREFILL node (4 ranks x 112 = 447 GiB).
#
# TOPOLOGY (bin-packed, 2 TEP=2 workers/node): TRAD's P/D no-share guard (topology.py:408,
# should_colocate hard-gated to total_worker_gpus<=gpus_per_node i.e. 12>4) prevents a single
# uniform 3-node 2/node pack — prefill and decode cannot share a node. The packable footprint
# is therefore 4 nodes: prefill_nodes:2 (3 prefill pack 2+1) + decode_nodes:2 (3 decode pack
# 2+1) => --nodes=4 / --segment=4 (down from 6 in the spread sibling). n0=2 prefill, n1=1
# prefill, n2=2 decode, n3=1 decode; 12 active GPUs. etcd/nats + frontend + KV-router
# co-located on the head node (no dedicated infra node). Image kvbm-prod-260607.sqsh.

name: "kvbm-tpd-3p3d-binpack120-c64"

identity:
  model:
    repo: "nvidia/Qwen3-235B-A22B-Instruct-2507-NVFP4"
    revision: "1c4ec35802abf3a20672be7e5c51a098796f71d6"
  container:
    image: "nvcr.io/nvidian/dynamo-dev/ryan:kvbm-vllm-dev-260602"
  frameworks:
    dynamo: "1.2.0"
    vllm: "0.21.0"

slurm:
  account: "core_dlfw_ci"
  partition: "tcpo"
  time_limit: "01:45:00"

setup_script: kvbm-dev-install.sh
dynamo:
  install: false

model:
  path: "hf:nvidia/Qwen3-235B-A22B-Instruct-2507-NVFP4"
  container: "/lustre/fsw/core_dlfw_ci/ryan/enroot_images/kvbm-prod-260607.sqsh"  # FP8 + B-GNMT + breaker + CD token-load metrics
  precision: "fp4"

extra_mount:
  - "/lustre/fsw/core_dlfw_ci/ryan/kvbm-experiments/dynamo:/workspace"
  - "/lustre/fsw/core_dlfw_ci/ryan/kvbm-experiments:/models"
  - "/lustre/fsw/core_dlfw_ci/ryan/hf_cache:/hf_cache"

environment:
  HF_HOME: "/hf_cache"
  HF_HUB_OFFLINE: "1"
  KVBM_SKIP_VLLM_VERSION_CHECK: "1"
  VLLM_ATTENTION_BACKEND: "FLASH_ATTN"
  ENABLE_EXPERT_PARALLEL: "1"           # TEP: 235B-A22B (128 experts) — EP across the 2 TP ranks
  NIXL_PLUGIN_DIR: "/usr/local/lib/python3.12/dist-packages/.nixl_cu13.mesonpy.libs/plugins"
  # No hub => G2 activity reads from vllm:external_prefix_cache_hits on the prefill workers.
  DYN_LOG: "error"
  RUST_LOG: "error"

resources:
  gpu_type: "gb200"
  gpus_per_node: 4
  # Native dynamo P/D disagg: 3 PREFILL + 3 DECODE TEP=2 workers (2 GPU each), BIN-PACKED 2/node.
  # prefill_nodes:2 + decode_nodes:2 = 4 nodes total (--nodes/--segment). spread_workers omitted
  # (=false) so each side packs 2 workers/node (n0=2P, n1=1P, n2=2D, n3=1D). gpus_per_prefill /
  # gpus_per_decode MUST stay explicit at 2 (TEP=2); dropping them computes (2*4)/3 and breaks TP.
  prefill_nodes: 2
  prefill_workers: 3
  gpus_per_prefill: 2
  decode_nodes: 2
  decode_workers: 3
  gpus_per_decode: 2
  spread_workers: false                 # bin-pack: 2 TEP=2 workers/node where they fit (vs 1/node spread)

infra:
  etcd_nats_dedicated_node: false       # co-locate etcd/nats + frontend on the head node (no extra node)

frontend:
  type: dynamo
  enable_multiple_frontends: false
  args:
    router-mode: "kv"                   # KV-AWARE, P-first (routes to a prefill worker first)
    router-kv-events: true              # consume the prefill consolidator's G1+G2 KV events
    router-min-initial-workers: 3       # = prefill_workers (the KV-routable / KV-event-publishing pool)

backend:
  type: vllm

  # BIN-PACK prefill + decode onto shared nodes: 3P + 3D TEP=2 (2 GPU each) pack 2
  # workers/node => 3 nodes (n0=2P, n1=1P+1D, n2=2D) instead of 4 (2 prefill + 2 decode
  # nodes). Each worker still gets its OWN 2 GPUs (prefill 0,1 + decode 2,3 on the mixed
  # node), distinct ZMQ/NIXL ports — no role-mixing hardware blocker (AGG already runs 2
  # NIXL-UCX vLLM/node). Config.total_nodes derives 3 from the actual allocation.
  allow_prefill_decode_colocation: true

  # KVBM + consolidator on the PREFILL workers (mirror the CD decode wiring): kvbm_consolidator
  # forces prefix-caching ON + emits per-worker KV events the consolidator relays to the
  # KV-router. The prefill connector is a PdConnector wrapping the kvbm v2 DynamoConnector
  # (child[0]: local prefix match/offload/onboard; G2 host cache_size_gb=120 PER-RANK, dropped
  # from 160 for the bin-packed host-mem budget) AND a NixlConnector (child[1]: the
  # prefill->decode KV transfer). Decode workers use connector: nixl (plain vLLM) so the
  # consolidator path never fires for them and they pin ~0 host cache.
  kvbm_consolidator: true

  prefill_environment:
    DYN_HEALTH_CHECK_ENABLED: "false"
    PYTHONUNBUFFERED: "1"

  decode_environment:
    DYN_HEALTH_CHECK_ENABLED: "false"
    PYTHONUNBUFFERED: "1"

  vllm_config:
    prefill:
      served-model-name: "nvidia/Qwen3-235B-A22B-Instruct-2507-NVFP4"
      tensor-parallel-size: 2           # TEP=2
      enable-expert-parallel: true
      gpu-memory-utilization: 0.85
      block-size: 64
      max-model-len: 262144
      # PdConnector: KVBM (G2=120/rank, consolidator) composed with NIXL (P->D transfer).
      connector: '{"kv_connector": "PdConnector", "kv_role": "kv_both", "kv_connector_module_path": "kvbm.v2.vllm.connector", "kv_connector_extra_config": {"connectors": [{"kv_connector": "DynamoConnector", "kv_role": "kv_both", "kv_connector_module_path": "kvbm.v2.vllm.connector", "kv_connector_extra_config": {"default": {"block_layout": "operational"}, "leader": {"cache": {"host": {"cache_size_gb": 120.0}}, "max_seq_len": 262144}, "worker": {"nixl": {"backends": {"UCX": {}, "POSIX": {}}}}}}, {"kv_connector": "NixlConnector", "kv_role": "kv_both"}]}}'

    decode:
      served-model-name: "nvidia/Qwen3-235B-A22B-Instruct-2507-NVFP4"
      tensor-parallel-size: 2           # TEP=2
      enable-expert-parallel: true
      gpu-memory-utilization: 0.85
      block-size: 64
      max-model-len: 262144
      connector: "nixl"                 # PLAIN vLLM decode: NIXL only, no kvbm/consolidator

benchmark:
  type: "trace-replay-sa"
  public_dataset: "semianalysis_cc_traces_weka_with_subagents_256k"
  num_dataset_entries: 470           # full with-subagents 256k corpus (470 traces)
  concurrencies: "64"
  ttft_threshold_ms: 5000
  itl_threshold_ms: 10
  aiperf_package: "git+https://github.com/cquil11/aiperf.git@062a5de92c8ac8a0a6dd5d2a7fb9a539a147f3d9"
  aiperf_args:
    benchmark-duration: 1200
    benchmark-grace-period: 30
    request-timeout-seconds: 1200
    workers-max: 200
    record-processors: 8
    profile-export-level: raw
    concurrency-ramp-duration: 120
    export-http-trace: true
